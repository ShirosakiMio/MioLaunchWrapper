plugins {
    id 'java'
}

group = 'mio'
version = ''

repositories {
    mavenCentral()
}

dependencies {
}


java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'mio.Wrapper'
        )
    }
}